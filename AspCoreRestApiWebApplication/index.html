<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Employees Dashboard</title>
</head>
<body>
    <h2>Employee list:</h2>
    <div>
        <input type="hidden" id="employeeId" />
        <p>
            <label>Name: </label>
            <input type="text" id="name" />
            <label>Age: </label>
            <input type="number" id="age" />
            <button type="button" id="buttonSave">Save</button>
            <button type="button" id="buttonReset">Reset</button>
        </p>

        <table class="table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        async function getEmployees() {
            const response = await fetch("/api", {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                }
            });

            if (response.ok === true) {
                const employees = await response.json();
                const tbody = document.querySelector("tbody");

                employees.forEach(e => tbody.append(tableRowCreate(e)));
            }
        }

        async function getEmployee(id) {
            const response = await fetch(`/api/${id}`, {
                method: "GET",
                headers: {
                    "Accept": "application/json",
                }
            });

            if (response.ok === true) {
                const employee = await response.json();

                document.getElementById("employeeId").value = employee.id;
                document.getElementById("name").value = employee.name;
                document.getElementById("age").value = employee.age;
            }
            else {
                const error = await response.json();
                console.log(error.message);
            }
        }

        async function createEmployee(employeeName, employeeAge) {
            const response = await fetch("/api", {
                method: "POST",
                headers: {
                    "Accept": "application/json",
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    name: employeeName,
                    age: parseInt(employeeAge, 10)
                })
            });

            if (response.ok === true) {
                const employee = await response.json();
                document.querySelector("tbody")
                        .append(tableRowCreate(employee));
            }
            else {
                const error = await response.json();
                console.log(error.message);
            }
        }

        async function editEmployee(employeeId, employeeName, employeeAge) {

            const response = await fetch(`/api`, {
                method: "PUT",
                headers: {
                    "Accept": "application/json",
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    id: employeeId,
                    name: employeeName,
                    age: parseInt(employeeAge, 10)
                })
            });

            if (response.ok === true) {
                const employee = await response.json();
                document.querySelector(`tr[data-id="${employee.id}"]`)
                    .replaceWith(tableRowCreate(employee));
            }
            else {
                const error = await response.json();
                console.log(error.message);
            }
        }

        async function deleteEmployee(id) {
            const response = await fetch(`/api/${id}`, {
                method: "DELETE",
                headers: {
                    "Accept": "application/json",
                }
            });

            if (response.ok === true) {
                const employee = await response.json();

                document.querySelector(`tr[data-id="${employee.id}"]`)
                    .remove();
            }
            else {
                const error = await response.json();
                console.log(error.message);
            }
        }

        async function saveHandler() {
            const id = document.getElementById("employeeId").value;
            const name = document.getElementById("name").value;
            const age = document.getElementById("age").value;

            if (id === "")
                await createEmployee(name, age);
            else
                await editEmployee(id, name, age);
            resetHandler();
        }

        function resetHandler() {
            document.getElementById("employeeId").value = "";
            document.getElementById("name").value = "";
            document.getElementById("age").value = 0;
        }

        function tableRowCreate(employee) {
            const tr = document.createElement("tr");
            tr.setAttribute("data-id", employee.id);

            const tdName = document.createElement("td");
            tdName.append(employee.name);
            tr.append(tdName);

            const tdAge = document.createElement("td");
            tdAge.append(employee.age);
            tr.append(tdAge);

            const tdEdit = document.createElement("td");
            const buttonEdit = document.createElement("button");
            buttonEdit.append("Edit");
            buttonEdit.addEventListener("click", async () => await getEmployee(employee.id));
            tdEdit.append(buttonEdit);
            tr.append(tdEdit);

            const tdDelete = document.createElement("td");
            const buttonDelete = document.createElement("button");
            buttonDelete.append("Delete");
            buttonDelete.addEventListener("click", async () => await deleteEmployee(employee.id));
            tdDelete.append(buttonDelete);
            tr.append(tdDelete);

            return tr;
        }

        document.getElementById("buttonSave")
            .addEventListener("click", async () => saveHandler());
        document.getElementById("buttonReset")
                .addEventListener("click", () => resetHandler());

        getEmployees();
    </script>
</body>
</html>
